<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple memory card matching game built with vanilla HTML, Tailwind CSS, and JavaScript."
    />
    <title>Memory Card Game</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main
      class="mx-auto flex min-h-screen w-full max-w-5xl flex-col items-center justify-center px-4 py-8 sm:px-6"
    >
      <section
        class="w-full max-w-3xl rounded-3xl border border-slate-800 bg-slate-900/80 p-5 shadow-2xl shadow-black/30 backdrop-blur sm:p-8"
        aria-labelledby="game-title"
      >
        <header class="mb-6 text-center">
          <p
            class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-indigo-400"
          >
            Matching Challenge
          </p>

          <h1
            id="game-title"
            class="text-3xl font-bold tracking-tight text-white sm:text-4xl"
          >
            Memory Card Game
          </h1>

          <p
            class="mx-auto mt-3 max-w-xl text-sm leading-6 text-slate-400 sm:text-base"
          >
            Flip two cards at a time and find every matching pair.
          </p>
        </header>

        <div
          class="mb-6 grid grid-cols-3 gap-3 sm:grid-cols-[1fr_1fr_auto] sm:items-center"
        >
          <div class="rounded-2xl bg-slate-800/80 px-4 py-3 text-center">
            <span
              class="block text-xs font-medium uppercase tracking-wide text-slate-400"
            >
              Moves
            </span>
            <span
              id="moves"
              class="mt-1 block text-xl font-bold text-white"
              aria-live="polite"
            >
              0
            </span>
          </div>

          <div class="rounded-2xl bg-slate-800/80 px-4 py-3 text-center">
            <span
              class="block text-xs font-medium uppercase tracking-wide text-slate-400"
            >
              Matches
            </span>
            <span
              id="matches"
              class="mt-1 block text-xl font-bold text-white"
              aria-live="polite"
            >
              0 / 8
            </span>
          </div>

          <button
            id="restart-button"
            type="button"
            class="col-span-1 min-h-16 rounded-2xl bg-indigo-500 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:ring-offset-2 focus:ring-offset-slate-900 sm:min-h-0"
          >
            Restart
          </button>
        </div>

        <div
          id="game-board"
          class="grid grid-cols-4 gap-2.5 sm:gap-4"
          aria-label="Memory card game board"
        ></div>

        <p
          id="game-status"
          class="mt-6 min-h-6 text-center text-sm font-medium text-slate-400"
          aria-live="polite"
        >
          Select a card to begin.
        </p>
      </section>

      <footer class="mt-5 text-center text-xs text-slate-600">
        Match all eight pairs to complete the game.
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
